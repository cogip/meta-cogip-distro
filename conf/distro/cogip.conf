# Cogip distro: minimal Wayland kiosk on Raspberry Pi 4.

DISTRO          = "cogip"
DISTRO_NAME     = "Cogip Kiosk"
DISTRO_VERSION  = "1.0"
DISTRO_CODENAME = "scarthgap"

MAINTAINER      = "Cogip Robotics <g.doffe@gmail.com>"

TARGET_VENDOR   = "-cogip"

# Wayland-only graphics stack. X11 / Mir explicitly excluded to keep the
# image small and the boot path short. "virtualization" pulls in the
# container runtime feature set required by meta-virtualization (docker).
DISTRO_FEATURES:append = " wayland opengl pam systemd usrmerge virtualization"
DISTRO_FEATURES:remove = "x11 sysvinit"

# Keep /var/log on the rootfs (not a tmpfs symlink to /var/volatile/log),
# so the persistent journal (journald Storage=persistent, set in the
# systemd bbappend) survives a power cycle and can be read off the SD
# card. On wrynose VOLATILE_LOG_DIR is gone; base-files now drives the
# volatile /var/log symlink off FILESYSTEM_PERMS_TABLES, so drop the
# volatile-log table (keep volatile /tmp) to make /var/log a real dir.
FILESYSTEM_PERMS_TABLES = "files/fs-perms.txt files/fs-perms-volatile-tmp.txt"

# oe-core's *-ptest packages on wrynose (bash, gawk, ...) rdepend on
# locale-base-* test locales without declaring them as build deps, which
# the build-deps QA flags as a FATAL error. Those ptest packages are
# never shipped in the kiosk, and it is an upstream gap affecting many
# recipes -- downgrade build-deps to a warning instead of failing the
# build (or whack-a-mole INSANE_SKIP per recipe).
ERROR_QA:remove = "build-deps"
WARN_QA:append = " build-deps"

# systemd as init (PID 1) and as service manager. Faster cold-boot than
# sysvinit once tuned and lets us order Cog after the compositor cleanly.
INIT_MANAGER          = "systemd"
VIRTUAL-RUNTIME_init_manager     = "systemd"
VIRTUAL-RUNTIME_initscripts      = "systemd-compat-units"
VIRTUAL-RUNTIME_login_manager    = "shadow-base"
VIRTUAL-RUNTIME_dev_manager      = "systemd"

# Image format: compressed .wic.bz2 to flash on SD with dd.
# The 3-partition WKS_FILE (boot/root/data) is set by the kiosk image
# recipe in meta-cogip-app, which owns the image + its partitioning.
IMAGE_FSTYPES = "wic.bz2 wic.bmap"

# Pi 4 specific tunings: use the 64-bit kernel and the vc4-kms-v3d
# DRM/KMS driver (no closed dispmanx). This is what the v3d Mesa
# pipeline needs for WPE WebKit hardware acceleration.
RPI_USE_U_BOOT       = "0"
ENABLE_UART          = "1"
DISABLE_RPI_BOOT_LOGO = "0"
RASPBERRYPI_CAMERA_MODULE = "0"

# Native cogip stack: use the prebuilt-wheel recipes (meta-cogip-app) for the
# compiled scientific deps instead of compiling them from source (opencv C++
# especially). python3-opencv-contrib provides cv2 (incl. aruco) for the
# python3-opencv requirement, so the OE opencv source recipe is never built.
# Pin numpy/matplotlib to our wheel versions (they win over the OE recipes by
# version; pillow/kiwisolver win by layer priority at equal version).
PREFERRED_RPROVIDER_python3-opencv = "python3-opencv-contrib"
PREFERRED_VERSION_python3-numpy      = "2.5.0"
PREFERRED_VERSION_python3-matplotlib = "3.11.0"

# Drop SPDX/SBOM generation (inherited by default via INHERIT_DISTRO). It adds
# do_create_recipe_spdx + do_create_package_spdx to every recipe -- thousands
# of tasks plus time and disk -- for license/supply-chain traceability we do
# not need on an internal kiosk image. Reflash-only, immutable target.
INHERIT_DISTRO:remove = "create-spdx"

# Pin the web stack to cogip-tools' tested versions: the OE recipes ship much
# newer fastapi/starlette (0.135 / 1.0) which dropped the legacy
# TemplateResponse(name, context) call the dashboard uses (500 at render).
PREFERRED_VERSION_python3-fastapi   = "0.115.2"
PREFERRED_VERSION_python3-starlette = "0.40.0"

# Ship the SPI1 + MCP251xFD device-tree overlays in /boot/overlays so the CAN
# config.txt overlays actually apply (the copilot CAN bus). The kernel builds
# them but they are NOT in meta-raspberrypi's default
# RPI_KERNEL_DEVICETREE_OVERLAYS list, so without this SPI1 stays disabled and
# can0 never appears. (SD overclock uses dtparam=sd_overclock, no overlay.)
RPI_KERNEL_DEVICETREE_OVERLAYS:append = " overlays/spi1-1cs.dtbo overlays/mcp251xfd.dtbo"

# Trim the busybox-shell perimeter; we still keep one tty for debugging
# but the kiosk auto-logs into the Cog session.
PACKAGECONFIG:remove:pn-systemd = "audit"

# Use systemd's own network + DNS stack: networkd for L3 and resolved
# for the stub resolver. NetworkManager stays out of the image.
PACKAGECONFIG:append:pn-systemd = " networkd resolved"

# WPE backend: fdo (Mesa GBM + EGL via DRM/Wayland) is the upstream
# default Cog expects. rdk targets RDK/Comcast set-top boxes, not us.
PREFERRED_PROVIDER_virtual/wpebackend  = "wpebackend-fdo"
PREFERRED_RPROVIDER_virtual-wpebackend = "wpebackend-fdo"

# Reduce locale footprint to en_US.UTF-8 only.
IMAGE_LINGUAS  = "en-us"
GLIBC_GENERATE_LOCALES = "en_US.UTF-8"

# Default kiosk URL injected at build time, overridable via the build
# environment (`make build KIOSK_URL=...`).
KIOSK_URL ??= "http://localhost:8080"
